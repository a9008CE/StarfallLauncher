<script>
/* 星野 + 流星 */
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');
  let w,h,stars=[],meteors=[];
  function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;
    c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
    stars=Array.from({length:150},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3*devicePixelRatio,
      p:Math.random()*Math.PI*2,s:.4+Math.random()*1.1}))}
  resize();addEventListener('resize',resize);
  function spawnMeteor(){
    if(meteors.length>3)return;
    const d=devicePixelRatio,fromLeft=Math.random()<.5;
    meteors.push({x:fromLeft?-120:Math.random()*w,y:Math.random()*h*.45,
      vx:(fromLeft?1:-1)*(5.5+Math.random()*4.5)*d, vy:(4.5+Math.random()*3.5)*d,
      len:(110+Math.random()*130)*d, life:1});
  }
  setInterval(spawnMeteor,2400);
  setTimeout(spawnMeteor,700);
  (function tick(t){
    x.clearRect(0,0,w,h);
    for(const s of stars){const a=.18+.5*Math.abs(Math.sin(t/1400*s.s+s.p));
      x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fillStyle='rgba(190,215,255,'+a.toFixed(3)+')';x.fill()}
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i],sp=Math.hypot(m.vx,m.vy);
      m.x+=m.vx;m.y+=m.vy;m.life-=.007;
      if(m.life<=0||m.x<-m.len-200||m.x>w+m.len+200||m.y>h+m.len){meteors.splice(i,1);continue}
      const nx=m.x-m.vx/sp*m.len,ny=m.y-m.vy/sp*m.len;
      const g=x.createLinearGradient(m.x,m.y,nx,ny);
      g.addColorStop(0,'rgba(205,232,255,'+(0.9*m.life).toFixed(3)+')');
      g.addColorStop(1,'rgba(205,232,255,0)');
      x.strokeStyle=g;x.lineWidth=1.6*devicePixelRatio;x.lineCap='round';
      x.beginPath();x.moveTo(m.x,m.y);x.lineTo(nx,ny);x.stroke();
    }
    requestAnimationFrame(tick)
  })(0)
})();
/* 滚动浮现 */
(function(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),
    {threshold:.12,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
})();
</script>
